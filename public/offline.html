<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline</title>
    <!--
        Served by the service worker when a page navigation fails with no
        network. Fully self-contained on purpose: no external CSS, fonts or
        JS, because by definition nothing else is reachable.
    -->
    <style>
        :root {
            color-scheme: light dark;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #f4f6fa;
            color: #1d273b;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #04060a;
                color: #cbd5e1;
            }
        }

        .box {
            text-align: center;
            padding: 2rem;
            max-width: 26rem;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0 0 0.5rem;
        }

        p {
            margin: 0 0 1.5rem;
            opacity: 0.75;
            line-height: 1.5;
        }

        button {
            font: inherit;
            padding: 0.5rem 1.25rem;
            border-radius: 0.5rem;
            border: 0;
            background: #066fd1;
            color: #fff;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>You're offline</h1>
        <p>
            NoteFiend needs a connection to reach your meetings and minutes.
            Nothing has been lost; reconnect and pick up where you left off.
        </p>
        <button onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
