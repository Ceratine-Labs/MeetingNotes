# /etc/supervisor/conf.d/meetingnotes-worker.conf
# Queue worker for minutes generation + backups. Generation of a long
# chunked transcript can take many minutes — timeout accordingly.
[program:meetingnotes-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/meetingnotes/artisan queue:work --sleep=3 --tries=2 --max-time=3600 --timeout=1800
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/meetingnotes-worker.log
stopwaitsecs=1830
